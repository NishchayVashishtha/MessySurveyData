[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-data-pipeline"
version = "0.1.0"
description = "Production-grade ELT survey data pipeline (MongoDB Data Lake -> Pandas Cleaning & Validation -> PostgreSQL Star Schema Warehouse)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Data Engineering Team" }
]
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pymongo>=4.6.0",
    "psycopg2-binary>=2.9.9",
    "SQLAlchemy>=2.0.25",
    "rapidfuzz>=3.6.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "tabulate>=0.9.0",
    "rich>=13.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4"]
ignore = ["E501", "B008", "B019"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=survey_pipeline --cov-report=term-missing --cov-report=html"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/survey_pipeline"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true

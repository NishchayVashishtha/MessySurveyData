services:
  mongodb:
    image: mongo:7.0
    container_name: survey_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-survey_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-survey_secret_pass}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-survey_raw_lake}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - survey-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' -u ${MONGO_USER:-survey_admin} -p ${MONGO_PASSWORD:-survey_secret_pass} --authenticationDatabase admin --quiet"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: survey_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-survey_engineer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-survey_pg_pass}
      POSTGRES_DB: ${POSTGRES_DB:-survey_dw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/01_init_schemas.sql:/docker-entrypoint-initdb.d/01_init_schemas.sql:ro
      - ./sql/02_warehouse_tables.sql:/docker-entrypoint-initdb.d/02_warehouse_tables.sql:ro
      - ./sql/03_indexes.sql:/docker-entrypoint-initdb.d/03_indexes.sql:ro
      - ./sql/04_analytics_views.sql:/docker-entrypoint-initdb.d/04_analytics_views.sql:ro
    networks:
      - survey-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-survey_engineer} -d ${POSTGRES_DB:-survey_dw}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: survey_pipeline
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:-survey_admin}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-survey_secret_pass}
      MONGO_DB: ${MONGO_DB:-survey_raw_lake}
      MONGO_AUTH_SOURCE: admin
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-survey_engineer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-survey_pg_pass}
      POSTGRES_DB: ${POSTGRES_DB:-survey_dw}
      DATA_DIR: /app/data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FUZZY_MATCH_THRESHOLD: ${FUZZY_MATCH_THRESHOLD:-85.0}
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
      - ./logs:/app/logs
    networks:
      - survey-net
    command: ["--source", "synthetic", "--batch-id", "auto"]

  mongo-express:
    image: mongo-express:latest
    container_name: survey_mongo_express
    restart: unless-stopped
    profiles: ["tools", "all"]
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-survey_admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-survey_secret_pass}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_USER:-survey_admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_PASSWORD:-survey_secret_pass}
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - survey-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: survey_pgadmin
    restart: unless-stopped
    profiles: ["tools", "all"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@surveyanalytics.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - survey-net

volumes:
  mongo_data:
    name: survey_mongo_data
  pg_data:
    name: survey_pg_data

networks:
  survey-net:
    name: survey_network
    driver: bridge
